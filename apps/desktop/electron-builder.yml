appId: fr.niszczota.titiworldedit
productName: Titi WorldEdit
copyright: © Baptiste Niszczota

directories:
  output: release
  buildResources: build

# Le renderer est bundlé par Vite ; le processus principal, le preload et le
# moteur partent en source (ils tournent dans Node, pas dans un navigateur).
files:
  - src/main/**
  - src/preload/**
  - src/engine/**
  - dist/renderer/**
  - assets/**
  - package.json

# Le paquet du moteur est un workspace : electron-builder doit l'embarquer.
extraMetadata:
  main: src/main/index.js

asar: true
asarUnpack:
  # La police Unifont est lue par `fs.readFileSync` dans le moteur de rendu de
  # texte : un fichier lu par chemin ne peut pas vivre dans l'archive asar.
  # C'est la SEULE chose à en sortir — ce projet n'a aucune dépendance native.
  - '**/node_modules/@titi/we-engine/assets/**'

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Pas de signature pour l'instant : Windows affichera un avertissement
  # SmartScreen au premier lancement. À traiter quand un certificat existera.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Titi WorldEdit

portable:
  artifactName: ${productName}-${version}-portable.${ext}

publish: null
