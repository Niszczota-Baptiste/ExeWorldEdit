<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Le renderer ne charge rien d'autre que lui-même : ni CDN, ni police
         distante, ni requête réseau. Tout vient du protocole app://. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' app:; script-src 'self' app:; style-src 'self' app: 'unsafe-inline'; font-src app:; img-src app: data: blob:; connect-src 'self' app:; worker-src app: blob:;" />
    <title>Titi WorldEdit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.jsx"></script>
  </body>
</html>
